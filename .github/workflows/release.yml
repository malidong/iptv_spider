# this file is *not* meant to cover or endorse the use of GitHub Actions, but rather to
# help make automated releases for this project

name: Release

on:
  release:
    # Trigger when a release is published on GitHub
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Grant read access to repository contents for private repos
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing (OIDC)
      id-token: write
    steps:
      - name: Checkout (SSH)
        uses: actions/checkout@v4
        with:
          # Use the SSH private key stored in the repo secret
          ssh-key: ${{ secrets.IPTV_SPIDER_SECRET }}
          # Restrict known hosts to GitHub to avoid interactive prompts
          ssh-known-hosts: github.com
          # Fetch full history and tags so releases and tags are available
          fetch-depth: 0
          # Do not persist HTTPS credentials because we're using SSH
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build dependencies
        run: python3 -m pip install -U setuptools wheel build --user
      - name: Build
        run: python3 -m build .
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true